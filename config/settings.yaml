# ---------------------------------------------------------------
# AI Trading Bot Team - main settings
# ---------------------------------------------------------------

# paper = practice money, live = real money.
# Don't edit this by hand. Use the "Switch trading mode" action on GitHub
# (the dashboard button links to it). Going live needs your approval there.
mode: paper

# Emergency stop. Set to true and the bots stop placing new trades
# (reports keep running).
paused: false

# Which AI provider each kind of bot tries first. If one is out of quota or
# down, the request moves to the next one in the list automatically.
#   fast  = researchers, executives, Reporter (lots of small jobs)
#   smart = managers and President (fewer, more important decisions)
ai_routing:
  fast:  [groq, gemini, openrouter]
  smart: [gemini, groq, openrouter]

# Most calls per day for each provider, kept just under their free limits.
ai_daily_caps:
  gemini: 240
  groq: 900
  openrouter: 45      # raise to ~950 if you ever add the one-time $10 on OpenRouter

# Optional: force a specific model per provider, e.g.  groq: openai/gpt-oss-120b
ai_models: {}

# Which Gemini models the bots use.
#   auto-flash = newest Gemini Flash model (free tier) -> researchers, executives, Reporter
#   auto-pro   = newest Gemini Pro model (uses your $10/month Cloud credit) -> President, managers
# If Pro isn't available on your API key, those bots fall back to Flash automatically.
# You can also write an exact model name, e.g. gemini-2.5-flash
models:
  fast: auto-flash
  smart: auto-pro

# Hard risk rules. Enforced by plain code, not by the AI.
# The President can make these STRICTER each day, but can never loosen them.
risk:
  max_position_pct: 0.20            # most of a team's budget that can go into one stock
  max_daily_loss_pct: 0.03          # no new buys once the portfolio is down 3% today
  max_open_positions_per_team: 5
  max_trades_per_team_per_day: 25  # buys per team per day (day trading turns money over often)
  min_conviction_to_buy: 3          # managers rate every idea 1-5
  cash_reserve_pct: 0.10            # always keep 10% of the money in cash
  default_stop_loss_pct: 0.015      # day trading: sell automatically if a stock drops 1.5% from where we bought
  default_take_profit_pct: 0.03     # day trading: take the profit after a 3% gain
  min_stop_loss_pct: 0.005
  max_stop_loss_pct: 0.05
  allow_fractional_shares: true     # lets small accounts buy part of a share
  min_invested_pct: 0.75            # each team must keep at least 75% of its budget in stocks
                                    # while the market is open (set by you; the President can't lower it)

# All-day trading. The bots watch the market from open to close.
intraday:
  check_every_minutes: 5          # prices, stop-losses and fresh news are checked this often
  replan_every_minutes: 20        # each manager takes a full new look at least this often
  price_move_trigger_pct: 0.02    # ...or sooner if one of its stocks moves 2% since its last look
  max_ai_calls_per_day: 1000      # overall safety cap across all providers; after this the
                                  # bots stop making new decisions but stop-losses still work
  strategy: day_trading            # managers trade intraday moves and end each day in cash
  close_positions_before_close: true    # sell everything ~10 min before 4 PM (pure day trading)
  no_new_buys_after: "15:30"            # no new positions in the last 30 minutes

# Research never stops: after the close, overnight and on weekends the
# researchers keep reading news, filings and social posts. What they find is
# handed to the managers at the next open.
after_hours:
  check_every_minutes: 15
  max_ai_calls_per_day: 300       # separate from the trading-day budget above

# Political & social media watch.
market_watch:
  enabled: true
  # Truth Social (Trump's posts) is read for free from the public trumpstruth.org archive.
  # X (Twitter) needs an X_BEARER_TOKEN secret. X charges about $0.005 per post read,
  # so 150 posts/day is about $0.75/day. Without the secret, X is skipped.
  x_max_posts_per_day: 150
  x_accounts: [realDonaldTrump, WhiteHouse, elonmusk, federalreserve, SECGov,
               DeptofWar, NASA, CommerceGov, USTreasury]

# Making practice trading feel like the real thing.
realism:
  slippage_pct: 0.0005   # real orders fill a little worse than the quoted price (0.05% each way).
                         # Every trade's result is charged this, so the bots learn from realistic numbers.

# Safety cap for real money. In live mode the bots act as if the
# account holds at most this many dollars, even if it holds more.
live:
  max_capital_usd: 500

# What the team is compared against on the dashboard.
benchmark: SPY

# Optional. The SEC requires a name + email to read company filings,
# e.g. "Ben Smith ben@example.com". Leave empty to skip filings.
sec_contact: ""

# How many past lessons each manager remembers.
lessons_to_remember: 15

# Rules shown on the dashboard for when the team looks ready for real money.
go_live_checklist:
  min_trading_days: 60
  must_beat_benchmark: true
  max_drawdown_pct: 0.15
