<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Team Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --plane:#f4f4f1;--surface:#fcfcfb;--surface-2:#f6f6f3;--raised:#ffffff;
  --ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;--grid:#e8e7e1;--axis:#c3c2b7;
  --line:rgba(11,11,11,.09);--line-strong:rgba(11,11,11,.16);
  --accent:#2a78d6;--accent-soft:rgba(42,120,214,.10);--bench:#a3a199;
  --up:#006300;--up-mark:#0ca30c;--down:#c22f2f;--down-mark:#d03b3b;--warn:#b26a00;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --shadow-hover:0 2px 4px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.08);
  --r:14px;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --plane:#0d0d0d;--surface:#161615;--surface-2:#1d1d1c;--raised:#1f1f1e;
  --ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;--grid:#2a2a28;--axis:#383835;
  --line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.14);
  --accent:#3987e5;--accent-soft:rgba(57,135,229,.14);--bench:#6f6e68;
  --up:#3ccf6e;--down:#ff7b72;--warn:#f0a740;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-hover:0 8px 28px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d;--surface:#161615;--surface-2:#1d1d1c;--raised:#1f1f1e;
  --ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;--grid:#2a2a28;--axis:#383835;
  --line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.14);
  --accent:#3987e5;--accent-soft:rgba(57,135,229,.14);--bench:#6f6e68;
  --up:#3ccf6e;--down:#ff7b72;--warn:#f0a740;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-hover:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--plane);color:var(--ink);overflow-x:clip}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.ink2{color:var(--ink-2)}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px var(--accent-soft)}
.brand b{font-size:15px;letter-spacing:-.01em}.brand small{display:block;color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink-2);transition:background .2s var(--ease),color .2s var(--ease);position:relative}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;letter-spacing:.04em;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);width:max-content;white-space:nowrap}
.mode.live{background:rgba(208,59,59,.14);color:var(--down)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 2s var(--ease) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.6);opacity:0}}
.theme-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--ink-2);transition:background .2s;white-space:nowrap}
.theme-btn:hover{background:var(--surface-2)}
main{min-width:0;padding:28px 32px 64px}
.view{max-width:1240px;margin:0 auto}
.view.enter{animation:viewIn .45s var(--ease) both}
.view.leave{animation:viewOut .16s ease-in both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-4px)}}
.stagger>*{animation:rise .5s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}
.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.head h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em}
.head p{margin:4px 0 0;color:var(--ink-2)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}.crumb a:hover{color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.section-h{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}
.section-h h2{font-size:16px;margin:0;letter-spacing:-.01em}

.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.gteams{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.mt{margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:14px;font-weight:650;margin:0;letter-spacing:-.005em}
.card .ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.sub{font-size:12.5px;color:var(--muted)}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:27px;font-weight:650;letter-spacing:-.02em;margin-top:6px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12.5px;margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi .spark{margin-top:10px}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:12px;padding:2px 7px;border-radius:99px;white-space:nowrap}
.delta.up{background:rgba(12,163,12,.11)}.delta.down{background:rgba(208,59,59,.11)}.delta.flat{background:var(--surface-2);color:var(--ink-2)}

.team{display:block;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;position:relative;overflow:hidden}
.team:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--line-strong)}
.team::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.team .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.team h3{margin:0;font-size:15px;letter-spacing:-.01em}
.team .go{opacity:0;transform:translateX(-4px);transition:.25s var(--ease);color:var(--muted)}
.team:hover .go{opacity:1;transform:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats div{min-width:0}.stats b{display:block;font-size:15px;font-weight:650;white-space:nowrap}.stats span{font-size:11.5px;color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}

.tw{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{transition:background .15s}tr.row:hover{background:var(--surface-2)}
tr.click{cursor:pointer}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.why{color:var(--ink-2);font-size:12.5px;max-width:460px;min-width:180px}
tr.detail td{background:var(--surface-2);font-size:13px;color:var(--ink-2)}
tr.detail .inner{animation:rise .3s var(--ease) both}
.sym{font-weight:650;letter-spacing:.01em;white-space:nowrap}
td .num{white-space:nowrap}
.brand b{white-space:nowrap}
.more{display:block;margin:14px auto 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid var(--line)}
.pill.buy{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.pill.sell{color:var(--s2);background:rgba(235,104,52,.12);border-color:transparent}
.pill.win{color:var(--up);background:rgba(12,163,12,.11);border-color:transparent}
.pill.loss{color:var(--down);background:rgba(208,59,59,.11);border-color:transparent}
.pill.open{color:var(--ink-2)}
.pill.block{color:var(--warn);background:rgba(250,178,25,.14);border-color:transparent}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 16px;position:relative;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:550;white-space:nowrap;transition:color .2s}
.tabs button:hover,.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:0;height:2px;background:var(--accent);border-radius:2px;transition:left .35s var(--ease),width .35s var(--ease)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2);transition:all .2s var(--ease);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .c{opacity:.6}
.search{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font:inherit;color:var(--ink);min-width:220px;outline:none;transition:border-color .2s,box-shadow .2s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tick{display:inline-block;font-size:12px;padding:3px 8px;border-radius:7px;background:var(--surface-2);margin:0 4px 4px 0;font-weight:600;color:var(--ink-2);border:1px solid var(--line)}
.tick.held{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--grid);border-radius:2px}
.ti{position:relative;padding-bottom:18px}
.ti:last-child{padding-bottom:0}
.ti::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--accent))}
.ti .t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ti p{margin:6px 0 0;color:var(--ink-2)}
.decs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.fi:last-child{border:0;padding-bottom:0}
.fi .tm{font-size:12px;color:var(--muted);padding-top:2px}
.fi .tx b{font-weight:650}
.fi .tx div{font-size:12.5px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.prose p{margin:0 0 10px;color:var(--ink-2)}.prose h3{font-size:16px;margin:0 0 8px;letter-spacing:-.01em}
.prose ul{margin:6px 0 10px;padding-left:18px;color:var(--ink-2)}.prose li{margin:3px 0}
.label{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-of-type{border:0}
.ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;color:#fff}
.ic.ok{background:var(--up-mark)}.ic.no{background:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover)}
.btn.danger{background:var(--down-mark);color:#fff;border-color:transparent}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:26px 12px;color:var(--muted)}
.empty svg{opacity:.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.split span{animation:grow .9s var(--ease) both;transform-origin:left}

.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fade .9s .35s var(--ease) both}@keyframes fade{from{opacity:0}}
.bar{transform-box:view-box;animation:barUp .7s var(--ease) both;transition:opacity .15s}
@keyframes barUp{from{transform:scaleY(0)}}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--raised);border:1px solid var(--line-strong);box-shadow:var(--shadow-hover);border-radius:10px;padding:9px 11px;font-size:12.5px;min-width:160px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.tip .tt{font-weight:650;margin-bottom:4px}
.tip .tr{display:flex;justify-content:space-between;gap:16px;color:var(--ink-2)}
.tip .tr b{color:var(--ink);font-variant-numeric:tabular-nums}
.range{display:block;width:150px;height:22px}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--grid),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:1180px){.k6{grid-template-columns:repeat(3,minmax(0,1fr))}.g21{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .brand>span:last-child{display:none}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);gap:12px;overflow-x:auto;overflow-y:hidden}
  .brand small,.nav .lbl,.side-foot .upd,.theme-btn span{display:none}
  .nav{flex-direction:row}.nav a{white-space:nowrap}.nav a.on::before{display:none}
  .side-foot{margin:0;flex-direction:row;align-items:center}
  main{padding:20px 16px 48px}
  .k4,.g11,.k6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:21px}
}
@media (max-width:560px){.k4,.g11{grid-template-columns:1fr}.fi{grid-template-columns:44px minmax(0,1fr)}.fi>:last-child{grid-column:2}.search{min-width:0;width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/">
      <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-9"/></svg></span>
      <span><b>Bot Team</b><small>AI trading desk</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span class="mode" id="mode"><span class="pulse"></span><span>PAPER</span></span>
      <span class="upd muted" style="font-size:12px" id="upd">Loading…</span>
      <button class="theme-btn" id="theme" aria-label="Switch light or dark theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><span>Theme</span>
      </button>
    </div>
  </aside>
  <main><div class="view" id="view"><div class="skel" style="height:40px;width:260px"></div><div class="grid k4 mt"><div class="skel" style="height:120px"></div><div class="skel" style="height:120px"></div><div class="skel" style="height:120px"></div><div class="skel" style="height:120px"></div></div><div class="skel mt" style="height:320px"></div></div></main>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
"use strict";
/* ============================== utilities ============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(x,dp=2)=>x==null||isNaN(x)?"–":(x<0?"−":"")+"$"+Math.abs(x).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp});
const smoney=x=>x==null?"–":(x>0?"+":"")+money(x);
const pct=(x,dp=2)=>x==null||isNaN(x)?"–":(x>0?"+":x<0?"−":"")+Math.abs(x*100).toFixed(dp)+"%";
const upct=(x,dp=0)=>x==null?"–":Math.round(x*100*10**dp)/10**dp+"%";
const cls=x=>x>0?"up":x<0?"down":"";
const delta=x=>x==null?"":`<span class="delta ${x>0?"up":x<0?"down":"flat"} num">${x>0?"▲":x<0?"▼":"■"} ${pct(x)}</span>`;
const fmtDate=d=>{if(!d)return"–";const t=new Date(d.length<=10?d+"T12:00":d);return isNaN(t)?d:t.toLocaleDateString(undefined,{month:"short",day:"numeric"})};
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/60000);return isNaN(m)?"":m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const SERIES=["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ICON={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
  trades:'<path d="M7 7h13l-3-3M17 17H4l3 3"/>',
  research:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  strategy:'<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>',
  empty:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/>',
  arrow:'<path d="M9 6l6 6-6 6"/>'
};
const svgI=(k,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const empty=(msg,sub="")=>`<div class="empty">${svgI("empty",26)}<div>${esc(msg)}</div>${sub?`<div style="font-size:12px">${esc(sub)}</div>`:""}</div>`;

let D=null,H=[],COLOR={};
const teamName=id=>D?.teams?.[id]?.name||id;
const shortName=id=>teamName(id).replace(/^Team \d+: /,"");
const teamColor=id=>`var(${COLOR[id]||"--s1"})`;
const tdet=id=>D?.team_details?.[id]||{};

function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const end=+el.dataset.count,fmt=el.dataset.fmt;const f=v=>fmt==="pct"?upct(v):fmt==="smoney"?smoney(Math.round(v*100)/100):money(v);
    if(REDUCED||!isFinite(end)){el.textContent=f(end);return}
    const t0=performance.now(),dur=1000;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(k<1?end*e:end);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
const tip=$("#tip");
function showTip(e,html){tip.innerHTML=html;tip.classList.add("on");const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+16,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-16;if(y+h>innerHeight-8)y=e.clientY-h-16;tip.style.left=x+"px";tip.style.top=y+"px"}
function hideTip(){tip.classList.remove("on")}

/* ============================== charts ============================== */
function niceTicks(lo,hi,n=4){const span=hi-lo||1,s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),err=s0/mag,step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;const t=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)t.push(+v.toFixed(10));return t}

function lineChart(el,series,{height=260,yFmt=pct,area=true,zero=true}={}){
  const W=Math.max(300,el.clientWidth||800),Hh=height,P={l:56,r:12,t:12,b:28};
  const n=Math.max(...series.map(s=>s.values.length));
  if(n<2){el.innerHTML=empty("The chart fills in after two trading days.");return}
  const xs=series[0].values.map(v=>v.x);
  const all=series.flatMap(s=>s.values.map(v=>v.y)).filter(v=>v!=null);if(zero)all.push(0);
  let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*.12||Math.abs(hi)*.1||.01;lo-=pad;hi+=pad;
  const X=i=>P.l+i*(W-P.l-P.r)/(n-1),Y=v=>P.t+(hi-v)*(Hh-P.t-P.b)/(hi-lo);
  let g=niceTicks(lo,hi,4).map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${P.l-8}" y="${Y(t)+4}" text-anchor="end">${yFmt(t,true)}</text>`).join("");
  if(zero&&lo<0&&hi>0)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)"/>`;
  const every=Math.ceil(n/(W<500?4:7));
  g+=xs.map((x,i)=>(i%every===0&&(n-1-i>=every*.6||i===0))||i===n-1?`<text x="${X(i)}" y="${Hh-8}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${esc(fmtDate(x))}</text>`:"").join("");
  const base=Y(Math.max(lo,Math.min(0,hi)));
  const paths=series.map((s,si)=>{
    const pts=s.values.map((v,i)=>v.y==null?null:[X(i),Y(v.y)]).filter(Boolean);if(pts.length<2)return"";
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("");
    const ar=area&&si===0?`<path class="fadein" d="${d}L${pts.at(-1)[0]},${base}L${pts[0][0]},${base}Z" fill="url(#gr${el.id})"/>`:"";
    return ar+`<path class="draw ${s.dash?"dash":""}" d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" height="${Hh}" role="img" aria-label="${esc(series.map(s=>s.name).join(" and "))} over time">
    <defs><linearGradient id="gr${el.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${series[0].color}" stop-opacity=".22"/><stop offset="1" stop-color="${series[0].color}" stop-opacity="0"/></linearGradient></defs>
    ${g}${paths}<line class="xh" y1="${P.t}" y2="${Hh-P.b}" stroke="var(--axis)" stroke-dasharray="3 3" opacity="0"/>${series.map((s,i)=>`<circle class="hd${i}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`).join("")}
    <rect x="${P.l}" y="0" width="${W-P.l-P.r}" height="${Hh}" fill="transparent" class="hit"/></svg>`;
  el.querySelectorAll("path.draw").forEach(p=>p.style.setProperty("--len",p.getTotalLength()));
  const svg=el.querySelector("svg"),xh=svg.querySelector(".xh"),hit=svg.querySelector(".hit");
  hit.addEventListener("pointermove",e=>{
    const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width;const i=Math.max(0,Math.min(n-1,Math.round((px-P.l)/((W-P.l-P.r)/(n-1)))));
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("opacity",1);
    series.forEach((s,si)=>{const c=svg.querySelector(".hd"+si),v=s.values[i]?.y;if(v==null){c.setAttribute("opacity",0);return}c.setAttribute("cx",X(i));c.setAttribute("cy",Y(v));c.setAttribute("opacity",1)});
    showTip(e,`<div class="tt">${esc(fmtDate(xs[i]))}</div>`+series.map(s=>`<div class="tr"><span><span class="dot" style="background:${s.color};width:8px;height:8px;margin-right:6px"></span>${esc(s.name)}</span><b>${s.values[i]?.y==null?"–":yFmt(s.values[i].y)}</b></div>`).join("")+(series[0].extra?series[0].extra(i):""));
  });
  hit.addEventListener("pointerleave",()=>{hideTip();xh.setAttribute("opacity",0);series.forEach((s,si)=>svg.querySelector(".hd"+si).setAttribute("opacity",0))});
}

function barChart(el,items,{height=220,fmt=smoney}={}){
  if(!items.length){el.innerHTML=empty("No closed trades yet.");return}
  const W=Math.max(300,el.clientWidth||600),Hh=height,P={l:56,r:8,t:10,b:26};
  const vals=items.map(i=>i.value);let lo=Math.min(0,...vals),hi=Math.max(0,...vals);const pad=(hi-lo)*.1||1;if(lo<0)lo-=pad;hi+=pad;
  const Y=v=>P.t+(hi-v)*(Hh-P.t-P.b)/(hi-lo),bw=(W-P.l-P.r)/items.length,gap=Math.max(2,Math.min(8,bw*.3)),y0=Y(0);
  let g=niceTicks(lo,hi,4).map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${P.l-8}" y="${Y(t)+4}" text-anchor="end">${money(t,0)}</text>`).join("");
  g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y0}" y2="${y0}" stroke="var(--axis)"/>`;
  const every=Math.ceil(items.length/(W<500?5:10));
  const bars=items.map((it,i)=>{const x=P.l+i*bw+gap/2,w=Math.max(2,bw-gap),y=Y(it.value),h=Math.max(1.5,Math.abs(y-y0)),r=Math.min(4,w/2,h),up=it.value>=0;
    const d=up?`M${x},${y0}V${y0-h+r}Q${x},${y0-h} ${x+r},${y0-h}H${x+w-r}Q${x+w},${y0-h} ${x+w},${y0-h+r}V${y0}Z`:`M${x},${y0}V${y0+h-r}Q${x},${y0+h} ${x+r},${y0+h}H${x+w-r}Q${x+w},${y0+h} ${x+w},${y0+h-r}V${y0}Z`;
    return`<path class="bar" data-i="${i}" d="${d}" fill="${up?"var(--up-mark)":"var(--down-mark)"}" style="transform-origin:0 ${y0}px;animation-delay:${Math.min(i*22,550)}ms"/>`+(i%every===0?`<text x="${x+w/2}" y="${Hh-8}" text-anchor="middle">${esc(it.label)}</text>`:"")}).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" height="${Hh}" role="img" aria-label="Profit or loss of each closed trade">${g}${bars}${items.map((it,i)=>`<rect data-i="${i}" class="hb" x="${P.l+i*bw}" y="0" width="${bw}" height="${Hh}" fill="transparent"/>`).join("")}</svg>`;
  const bs=[...el.querySelectorAll(".bar")];
  el.querySelectorAll(".hb").forEach(r=>{const it=items[+r.dataset.i];
    r.addEventListener("pointermove",e=>{bs.forEach(b=>b.style.opacity=b.dataset.i===r.dataset.i?1:.4);showTip(e,`<div class="tt">${esc(it.title||it.label)}</div><div class="tr"><span>Result</span><b class="${cls(it.value)}">${fmt(it.value)}</b></div>${it.sub||""}`)});
    r.addEventListener("pointerleave",()=>{hideTip();bs.forEach(b=>b.style.opacity=1)})});
}

function spark(values,color,h=36){
  if(!values||values.length<2)return`<svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" height="${h}" width="100%" aria-hidden="true"><line x1="0" x2="100" y1="${h/2}" y2="${h/2}" stroke="var(--grid)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/></svg>`;
  const lo=Math.min(...values),hi=Math.max(...values),sp=hi-lo||1;
  const pts=values.map((v,i)=>[i*100/(values.length-1),h-3-(v-lo)*(h-6)/sp]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(2)+","+p[1].toFixed(2)).join("");
  return`<svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" height="${h}" width="100%" aria-hidden="true"><path class="fadein" d="${d}L100,${h}L0,${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function rangeBar(p){
  if(!p.stop||!p.target)return'<span class="muted">–</span>';
  const lo=Math.min(p.stop,p.price),hi=Math.max(p.target,p.price),X=v=>6+(v-lo)/(hi-lo||1)*138;
  return`<svg class="range" viewBox="0 0 150 22" role="img" aria-label="Stop ${money(p.stop)}, bought ${money(p.entry)}, now ${money(p.price)}, target ${money(p.target)}">
   <rect x="${X(p.stop)}" y="9" width="${Math.max(0,X(p.entry)-X(p.stop))}" height="4" rx="2" fill="var(--down-mark)" opacity=".35"/>
   <rect x="${X(p.entry)}" y="9" width="${Math.max(0,X(p.target)-X(p.entry))}" height="4" rx="2" fill="var(--up-mark)" opacity=".35"/>
   <line x1="${X(p.entry)}" x2="${X(p.entry)}" y1="4" y2="18" stroke="var(--ink-2)" stroke-width="1.5"/>
   <circle cx="${X(p.price)}" cy="11" r="5" fill="${p.price>=p.entry?"var(--up-mark)":"var(--down-mark)"}" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

function table(rows,cols,{detail}={}){
  if(!rows?.length)return empty("Nothing here yet.");
  return`<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?"n":""}">${c.h}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>
    `<tr class="row ${detail?"click":""}" ${detail?`data-d="${i}" tabindex="0"`:""}>${cols.map(c=>`<td class="${c.n?"n":""}">${c.f?c.f(r):esc(r[c.k])}</td>`).join("")}</tr>`+
    (detail?`<tr class="detail" data-dd="${i}" hidden><td colspan="${cols.length}"><div class="inner">${detail(r)}</div></td></tr>`:"")).join("")}</tbody></table></div>`;
}
function wireDetails(root){root.querySelectorAll("tr[data-d]").forEach(tr=>{const t=()=>{const d=root.querySelector(`tr[data-dd="${tr.dataset.d}"]`);d.hidden=!d.hidden};tr.addEventListener("click",t);tr.addEventListener("keydown",e=>{if(e.key==="Enter")t()})})}

const tradeStatus=t=>t.status==="closed"?(t.pnl>0?'<span class="pill win">Win</span>':t.pnl<0?'<span class="pill loss">Loss</span>':'<span class="pill open">Even</span>'):t.status==="open"?'<span class="pill open">Open</span>':t.status==="submitted"?'<span class="pill open">Pending</span>':`<span class="pill open">${esc(t.status)}</span>`;
const exitText=r=>({stop_loss:"Stop-loss hit",take_profit:"Target hit",manager_sell:"Manager sold",end_of_day:"End of day"})[r]||r||"";
const conv=c=>c?`<span title="Conviction ${c}/5" class="num" style="letter-spacing:1px">${"●".repeat(c)}<span class="muted">${"●".repeat(Math.max(0,5-c))}</span></span>`:"–";
const tradeDetail=t=>`<div class="grid g11" style="gap:10px 28px">
  <div><div class="label" style="margin-top:0">Why the manager bought</div><div style="color:var(--ink)">${esc(t.reason)||"–"}</div></div>
  <div><div class="label" style="margin-top:0">The plan</div>Bought ${t.qty??"–"} share(s) at ${money(t.entry_price??t.est_price)}. Stop-loss ${money(t.stop_price)}, target ${money(t.take_profit_price)}. Conviction ${t.conviction??"–"}/5.
  ${t.status==="closed"?`<br>Sold at ${money(t.exit_price)}: ${esc(exitText(t.exit_reason))}${t.exit_note?" (“"+esc(t.exit_note)+"”)":""}.`:""}</div></div>`;

/* ============================== views ============================== */
const kpi=(label,valueHtml,sub="",sparkHtml="")=>`<div class="card kpi"><div class="l">${label}</div><div class="v num">${valueHtml}</div><div class="d">${sub}</div>${sparkHtml?`<div class="spark">${sparkHtml}</div>`:""}</div>`;

function overview(){
  const a=D.account||{},p=D.performance||{},teams=Object.entries(D.teams||{}),bench=esc(D.benchmark?.symbol||"SPY");
  const closed=teams.flatMap(([id])=>tdet(id).trades||[]).filter(t=>t.status==="closed"&&t.pnl!=null);
  const wins=closed.filter(t=>t.pnl>0).length,wr=closed.length?wins/closed.length:null;
  const beat=p.return_since_start!=null&&p.benchmark_since_start!=null?p.return_since_start-p.benchmark_since_start:null;
  const r=D.report,s=D.president||{};
  const feed=[...(D.trades_today||[]).map(t=>({time:t.time||"",t})),...(D.blocked_today||[]).map(b=>({time:b.time,b}))].sort((x,y)=>(y.time||"").localeCompare(x.time||"")).slice(0,10);
  return`
  <div class="head"><div><h1>Overview</h1><p>${new Date(D.updated).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})} · updated ${ago(D.updated)}</p></div>
    <div class="legend">${D.paused?'<span class="pill block">Trading paused</span>':""}<span class="tag">${teams.length} teams</span><span class="tag">${(D.positions||[]).length} open positions</span></div></div>
  <div class="grid k4 stagger">
    ${kpi("Account value",`<span data-count="${a.equity}">${money(a.equity)}</span>`,`${delta(a.day_change_pct)}<span class="muted">today</span>`,spark(H.map(h=>h.equity),css("--accent")))}
    ${kpi("Today's profit / loss",`<span class="${cls(a.day_change)}" data-count="${a.day_change}" data-fmt="smoney">${smoney(a.day_change)}</span>`,`<span class="muted">Cash on hand ${money(a.cash,0)}</span>`)}
    ${kpi("Since start",`<span class="${cls(p.return_since_start)}">${pct(p.return_since_start)}</span>`,`<span class="muted">${bench} ${pct(p.benchmark_since_start)}</span>${beat?`<span class="delta ${beat>0?"up":"down"}">${beat>0?"Beating":"Behind"} by ${pct(Math.abs(beat)).replace("+","")}</span>`:""}`)}
    ${kpi("Win rate",wr==null?"–":`<span data-count="${wr}" data-fmt="pct">${upct(wr)}</span>`,`<span class="muted">${wins} wins · ${closed.length-wins} losses · worst drop ${pct(-(p.max_drawdown||0))}</span>`)}
  </div>
  <div class="grid g21 mt stagger">
    <div class="card"><div class="ch"><div><h2>Performance vs ${bench}</h2><div class="sub">Return since the bots started, after slippage</div></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Bot team</span><span><i style="background:var(--bench)"></i>${bench}</span></div></div>
      <div class="chart" id="cPerf"></div></div>
    <div class="card"><div class="ch"><div><h2>Money per team</h2><div class="sub">Invested out of each team's budget</div></div></div>
      ${teams.map(([id,t])=>`<a href="#/team/${id}" style="display:block;margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${teamColor(id)}"></span>${esc(shortName(id))}</span><span class="num ink2">${money(t.invested,0)} / ${money(t.budget,0)}</span></div><div class="meter" style="--c:${teamColor(id)}"><i style="width:${Math.min(100,t.budget?t.invested/t.budget*100:0)}%"></i></div></a>`).join("")||empty("No teams yet.")}
      ${s.allocations?`<div class="label">President's split of the money</div><div class="split">${Object.entries(s.allocations).map(([id,v])=>`<span title="${esc(teamName(id))} ${Math.round(v*100)}%" style="flex:${v};background:${teamColor(id)}"></span>`).join("")}</div><div class="legend" style="margin-top:8px">${Object.entries(s.allocations).map(([id,v])=>`<span><span class="dot" style="background:${teamColor(id)};width:8px;height:8px"></span>${esc(shortName(id))} ${Math.round(v*100)}%</span>`).join("")}</div>`:""}
    </div>
  </div>
  <div class="section-h"><h2>Teams</h2><span class="sub">Open a team to see its trades and the strategies it tried</span></div>
  <div class="grid gteams stagger">${teams.map(([id,t])=>teamCard(id,t)).join("")}</div>
  <div class="grid g11 mt stagger">
    <div class="card"><div class="ch"><div><h2>Today's activity</h2><div class="sub">Trades, and orders the risk rules blocked</div></div><a class="sub" href="#/trades" style="color:var(--accent)">All trades →</a></div>
      ${feed.length?`<div class="feed">${feed.map(f=>f.t?`<div class="fi"><span class="tm num">${esc(f.t.time)}</span><div class="tx"><b>${esc(f.t.symbol)}</b> <span class="muted">· ${esc(shortName(f.t.team))}</span><div>${esc(f.t.reason)}</div></div><span>${f.t.status==="closed"?`<span class="num ${cls(f.t.pnl)}">${smoney(f.t.pnl)}</span>`:'<span class="pill buy">Bought</span>'}</span></div>`:`<div class="fi"><span class="tm num">${esc(f.b.time)}</span><div class="tx"><b>${esc(f.b.action)} ${esc(f.b.symbol)}</b> <span class="muted">· ${esc(shortName(f.b.team))}</span><div>${esc(f.b.reason)}</div></div><span class="pill block">Blocked</span></div>`).join("")}</div>`:empty("No trades yet today.")}</div>
    <div class="card prose"><div class="ch"><div><h2>Reporter's daily report</h2><div class="sub">${r?.date?fmtDate(r.date):"Written after each close"}</div></div></div>
      ${r?`<h3>${esc(r.headline)}</h3><p>${esc(r.summary)}</p><div class="grid g11" style="gap:12px"><div><div class="label">Best trade</div><p>${esc(r.best_trade)}</p></div><div><div class="label">Worst trade</div><p>${esc(r.worst_trade)}</p></div></div>${(r.concerns||[]).length?`<div class="label">Concerns</div><ul>${r.concerns.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}`:empty("The first report arrives after the first trading day.")}</div>
  </div>
  <div class="grid g21 mt stagger">
    <div class="card prose"><div class="ch"><div><h2>President's orders</h2><div class="sub">${s.updated?"Set "+ago(s.updated):"Strategy for the next session"}</div></div><a class="sub" href="#/strategy" style="color:var(--accent)">Strategy history →</a></div>
      ${s.strategy_notes?`<p style="color:var(--ink);font-size:14.5px">${esc(s.strategy_notes)}</p>${Object.entries(s.team_focus||{}).map(([id,v])=>`<div style="display:flex;gap:10px;margin:10px 0"><span class="dot" style="background:${teamColor(id)};margin-top:6px"></span><div><b>${esc(teamName(id))}</b><p style="margin:2px 0 0">${esc(v)}</p></div></div>`).join("")}`:empty("No strategy yet.")}</div>
    ${goLiveCard()}
  </div>`;
}
function afterOverview(){
  const b0=H.find(h=>h.benchmark)?.benchmark,e0=H[0]?.equity;
  lineChart($("#cPerf"),[
    {name:"Bot team",color:css("--accent"),values:H.map(h=>({x:h.date,y:e0?h.equity/e0-1:null})),extra:i=>`<div class="tr"><span>Account value</span><b>${money(H[i].equity)}</b></div>`},
    {name:D.benchmark?.symbol||"SPY",color:css("--bench"),values:H.map(h=>({x:h.date,y:b0&&h.benchmark?h.benchmark/b0-1:null}))}],{height:280});
}
function teamCard(id,t){
  const d=tdet(id),at=t.all_time||{},cum=(d.pnl_days||[]).map(x=>x.cum);
  return`<a class="card team" href="#/team/${id}" style="--c:${teamColor(id)}">

    ${goLiveCard()}
  </div>
  <div class="card mt"><div class="ch"><div><h2>Money per team over time</h2><div class="sub">The President's split, decided each evening</div></div><div class="legend">${Object.keys(D.teams).map(id=>`<span><i style="background:${teamColor(id)}"></i>${esc(shortName(id))}</span>`).join("")}</div></div><div class="chart" id="cAlloc"></div></div>
  <div class="grid g11 mt stagger">
    <div class="card"><div class="ch"><div><h2>President's decision log</h2><div class="sub">What changed each evening, and why</div></div></div>${log.length?`<div class="tl">${log.slice(0,30).map(l=>`<div class="ti"><div class="t">${fmtDate(l.date)}</div><p style="color:var(--ink)">${esc(l.decision)}</p><div class="decs">${Object.entries(l.allocations||{}).map(([id,v])=>`<span class="tag"><span class="dot" style="background:${teamColor(id)}"></span>${esc(shortName(id))} ${Math.round(v*100)}%</span>`).join("")}</div></div>`).join("")}</div>`:empty("No decisions yet.")}</div>
    <div class="grid" style="align-content:start">
      ${Object.values(ex).map(e=>`<div class="card prose"><div class="ch"><h2>${esc(e.title)}</h2></div><p>${esc(e.summary)}</p>${(e.escalations||[]).length?`<div class="label">Escalated to the President</div><ul>${e.escalations.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`).join("")}
      <div class="card"><div class="ch"><h2>Report history</h2></div>${idx.length?table(idx.slice(0,20),[{h:"Date",f:r=>`<span class="num">${fmtDate(r.date)}</span>`},{h:"Headline",f:r=>`<div class="why" style="color:var(--ink)">${esc(r.headline)}</div>`},{h:"Day",f:r=>`<span class="${cls(r.day_change_pct)}">${pct(r.day_change_pct)}</span>`,n:1}]):empty("No reports yet.")}</div>
    </div>
  </div>`;
}
function afterStrategy(){
  const log=D.strategy_log||[],ids=Object.keys(D.teams);
  lineChart($("#cAlloc"),ids.map(id=>({name:shortName(id),color:css(COLOR[id]),values:log.map(l=>({x:l.date,y:l.allocations?.[id]??null}))})),{height:220,area:false,zero:false,yFmt:v=>Math.round(v*100)+"%"});
}

/* ============================== shell & routing ============================== */
function repoUrl(){const h=location.hostname,p=location.pathname.split("/").filter(Boolean);return h.endsWith("github.io")&&p.length?`https://github.com/${h.split(".")[0]}/${p[0]}`:null}
function renderNav(r){
  const teams=Object.keys(D?.teams||{});
  $("#nav").innerHTML=`<a href="#/" class="${r==="overview"?"on":""}">${svgI("home")}Overview</a>
    <a href="#/trades" class="${r==="trades"?"on":""}">${svgI("trades")}All trades</a>
    <a href="#/research" class="${r==="research"?"on":""}">${svgI("research")}Research</a>
    <a href="#/strategy" class="${r==="strategy"?"on":""}">${svgI("strategy")}Strategy</a>
    <div class="lbl">Teams</div>${teams.map(id=>`<a href="#/team/${id}" class="${r==="team/"+id?"on":""}"><span class="dot" style="background:${teamColor(id)}"></span>${esc(shortName(id))}</a>`).join("")}`;
  const m=$("#mode");m.className="mode"+(D?.mode==="live"?" live":"");m.lastElementChild.textContent=(D?.mode==="live"?"LIVE":"PAPER")+" TRADING"+(D?.paused?" · PAUSED":"");
  $("#upd").textContent=D?.updated?"Updated "+ago(D.updated):"";
}
const route=()=>location.hash.replace(/^#\/?/,"")||"overview";
let current=null;
function render(animate=true){
  if(!D)return;
  const r=route(),v=$("#view");renderNav(r);
  const go=()=>{
    if(r.startsWith("team/")){const id=r.slice(5);v.innerHTML=team(id);if(D.teams?.[id])afterTeam(id,animate)}
    else if(r==="trades"){v.innerHTML=trades();afterTrades()}
    else if(r==="research"){v.innerHTML=research()}
    else if(r==="strategy"){v.innerHTML=strategy();afterStrategy()}
    else{v.innerHTML=overview();afterOverview()}
    if(animate){countUp(v);v.classList.remove("leave");v.classList.add("enter")}
    else{v.classList.remove("enter","leave");v.querySelectorAll(".stagger").forEach(s=>s.classList.remove("stagger"));v.querySelectorAll(".draw,.bar,.fadein,.meter i,.split span").forEach(e=>e.style.animation="none");v.querySelectorAll(".draw").forEach(e=>e.style.strokeDasharray="none")}
    current=r;
  };
  if(animate&&current!==null&&!REDUCED){v.classList.remove("enter");v.classList.add("leave");setTimeout(()=>{go();scrollTo({top:0})},150)}else go();
}
async function load(first){
  try{
    const [d,h]=await Promise.all(["data/dashboard.json","data/history.json"].map(u=>fetch(u+"?t="+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)));
    if(!d){$("#view").innerHTML=`<div class="head"><div><h1>Getting ready</h1><p>No data yet. It appears after the bots' first run.</p></div></div>`;return}
    const changed=!D||d.updated!==D.updated;D=d;H=h||[];
    Object.keys(D.teams||{}).forEach((id,i)=>COLOR[id]=SERIES[i%SERIES.length]);
    if(first||changed)render(!!first);
  }catch(e){console.error(e)}
}
addEventListener("hashchange",()=>render(true));
let rt,lastW=innerWidth;addEventListener("resize",()=>{if(Math.abs(innerWidth-lastW)<40)return;lastW=innerWidth;clearTimeout(rt);rt=setTimeout(()=>render(false),200)});
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#theme").addEventListener("click",()=>{const cur=document.documentElement.dataset.theme,dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches,t=dark?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}render(false)});
load(true);setInterval(()=>load(false),120000);
</script>
</body>
</html>
