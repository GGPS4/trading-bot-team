name: Bot Team

# GitHub runs these on a schedule (times are UTC, Monday-Friday).
# Each run first checks with Alpaca whether the market is open / it's a trading day.
on:
  schedule:
    - cron: "45 14 * * 1-5"   # morning: 10:45 AM EDT / 9:45 AM EST
    - cron: "30 17 * * 1-5"   # midday:   1:30 PM EDT / 12:30 PM EST
    - cron: "40 21 * * 1-5"   # evening:  5:40 PM EDT / 4:40 PM EST
  workflow_dispatch:
    inputs:
      phase:
        description: "What to run"
        type: choice
        options: [check, morning, midday, evening]
        default: check
      force:
        description: "Run even if the market is closed (orders are still blocked)"
        type: boolean
        default: false

concurrency:
  group: bot-team
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick phase
        id: phase
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "phase=${{ inputs.phase }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "45 14 * * 1-5") echo "phase=morning" >> "$GITHUB_OUTPUT" ;;
              "30 17 * * 1-5") echo "phase=midday"  >> "$GITHUB_OUTPUT" ;;
              *)               echo "phase=evening" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Run the bots
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: python run.py ${{ steps.phase.outputs.phase }} ${{ inputs.force && '--force' || '' }}

      - name: Save the bots' memory and dashboard data
        if: always()
        run: |
          git config user.name "bot-team"
          git config user.email "bot-team@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Bot team: ${{ steps.phase.outputs.phase }} $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
