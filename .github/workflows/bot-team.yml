name: Bot Team

# The bots run around the clock as a relay: each run decides what to do right
# now ("auto"), and when it finishes it starts the next run itself.
#   market open      -> trade (sessions up to ~5h20m, GitHub's job limit is 6h)
#   after the close  -> evening report, then research
#   nights/weekends  -> keep reading news, filings, Truth Social and X
# GitHub's own timer is unreliable (scheduled runs can start hours late), so it is
# only a backup that restarts the relay if it ever stops.
on:
  schedule:
    - cron: "7,37 * * * *"   # backup: every 30 minutes, restart the relay if it stopped
  workflow_dispatch:
    inputs:
      phase:
        description: "What to run"
        type: choice
        options: [auto, check, session, watch, evening]
        default: auto
      until:
        description: "For a session: trade until this time (ET, HH:MM)"
        default: "16:00"
      force:
        description: "Run even if the market is closed (orders are still blocked)"
        type: boolean
        default: false

concurrency:
  group: bot-team
  cancel-in-progress: false   # one run at a time; a newer waiting run replaces an older waiting one

permissions:
  contents: write
  actions: write     # lets a finished run start the next one

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
      ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
      ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
      ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOT_GIT_PUSH: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Set up saving
        run: |
          git config user.name "bot-team"
          git config user.email "bot-team@users.noreply.github.com"

      - name: Pick what to run
        id: phase
        run: |
          phase=auto; until=16:00; minutes=20
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            phase="${{ inputs.phase }}"; until="${{ inputs.until }}"
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "until=$until" >> "$GITHUB_OUTPUT"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Run the bots
        run: python run.py ${{ steps.phase.outputs.phase }} --until ${{ steps.phase.outputs.until }} --minutes ${{ steps.phase.outputs.minutes }} ${{ inputs.force && '--force' || '' }}

      - name: Evening report (after a manual session that ran to the close)
        if: steps.phase.outputs.phase == 'session' && steps.phase.outputs.until == '16:00'
        run: python run.py evening

      - name: Save the bots' memory and dashboard data
        if: always()
        run: |
          bash save.sh "Bot team: ${{ steps.phase.outputs.phase }} $(date -u +%Y-%m-%d)"

      - name: Start the next run (keeps the relay going)
        if: always() && steps.phase.outputs.phase == 'auto' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then sleep 120; fi
          gh workflow run bot-team.yml --ref main -f phase=auto
