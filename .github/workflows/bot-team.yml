name: Bot Team

# The bots trade all day, Monday-Friday. GitHub jobs can run at most 6 hours,
# so the trading day is split into two back-to-back sessions:
#   morning session:   starts before the open, waits for 9:30 AM ET, trades until 1:00 PM ET
#   afternoon session: trades 1:00 PM - 4:00 PM ET, then writes the evening report
# Outside market hours (nights and weekends) "watch" jobs keep the researchers
# reading news, SEC filings, Truth Social and X. They never trade.
# Times below are UTC (GitHub only uses UTC). They work in both summer and winter time.
on:
  schedule:
    - cron: "15 13 * * 1-5"      # morning session
    - cron: "45 16 * * 1-5"      # afternoon session (waits for the morning one to finish)
    - cron: "40 21 * * 1-5"      # backup evening report (skips itself if already done)
    - cron: "0 22 * * 1-5"       # evening watch (~6 PM - 11:30 PM ET)
    - cron: "45 3 * * 2-6"       # overnight watch (~11:45 PM - 5:15 AM ET)
    - cron: "30 9 * * 1-5"       # pre-market watch (~5:30 AM until the morning session)
    - cron: "15 9,15,21 * * 0,6" # weekend watches
    - cron: "0 3 * * 0,1"        # weekend overnight watch
  workflow_dispatch:
    inputs:
      phase:
        description: "What to run"
        type: choice
        options: [check, session, watch, evening]
        default: check
      until:
        description: "For a session: trade until this time (ET, HH:MM)"
        default: "16:00"
      force:
        description: "Run even if the market is closed (orders are still blocked)"
        type: boolean
        default: false

concurrency:
  group: bot-team
  cancel-in-progress: false

permissions:
  contents: write
  models: read      # lets the bots use GitHub Models for free

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
      ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
      ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
      ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOT_GIT_PUSH: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Set up saving
        run: |
          git config user.name "bot-team"
          git config user.email "bot-team@users.noreply.github.com"

      - name: Pick what to run
        id: phase
        run: |
          phase=evening; until=16:00; minutes=330
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            phase="${{ inputs.phase }}"; until="${{ inputs.until }}"; minutes=20
          else
            case "${{ github.event.schedule }}" in
              "15 13 * * 1-5") phase=session; until=13:00 ;;
              "45 16 * * 1-5") phase=session; until=16:00 ;;
              "40 21 * * 1-5") phase=evening ;;
              "30 9 * * 1-5")  phase=watch; minutes=215 ;;
              *)               phase=watch; minutes=330 ;;
            esac
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "until=$until" >> "$GITHUB_OUTPUT"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Run the bots
        run: python run.py ${{ steps.phase.outputs.phase }} --until ${{ steps.phase.outputs.until }} --minutes ${{ steps.phase.outputs.minutes }} ${{ inputs.force && '--force' || '' }}

      - name: Evening report (after the afternoon session)
        if: steps.phase.outputs.phase == 'session' && steps.phase.outputs.until == '16:00'
        run: python run.py evening

      - name: Save the bots' memory and dashboard data
        if: always()
        run: |
          git add state docs/data
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Bot team: ${{ steps.phase.outputs.phase }} $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
